[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbfio-sdk"
version = "0.1.0"
description = "Reader/writer for PBF and TXT electrophysiology data"
readme = "README.md"
requires-python = ">=3.8"
# TODO: replace with your own details before publishing
authors = [{ name = "Your Name", email = "you@example.com" }]
license = { text = "MPL-2.0" }
keywords = ["pbf", "patch-clamp", "electrophysiology", "nanopore", "science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.21"]

[project.scripts]
pbfio = "pbfio_sdk.__main__:main"

[project.urls]
Homepage = "https://github.com/your-account/pbfio-sdk"
Source = "https://github.com/your-account/pbfio-sdk"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pbfio_sdk"]
